# [X8.15] Nightly CI for the cross-server composition recipes.
#
# Runs every recipe's [X8.12] run.mjs companion (offline harness — fake areas,
# no secrets, no network) and reports a per-recipe pass/fail table to the job
# summary. Fails the job if ANY recipe's runnable script regresses, so the
# composition cookbook stays reproducible on a fresh runner.
#
# Secret-free + fork-friendly: the run.mjs scripts never make real tool calls.

name: Cookbook Composition Recipes

on:
  schedule:
    # Nightly at 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'cookbook/recipes-mcp-composition/**'
      - '.github/workflows/cookbook-composition.yml'

permissions:
  contents: read

jobs:
  run-recipes:
    name: Run composition recipe scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Run every recipe run.mjs (per-recipe pass/fail)
        shell: bash
        run: |
          set -uo pipefail
          BASE="cookbook/recipes-mcp-composition"
          fail=0
          total=0

          {
            echo "## Cookbook composition recipes — nightly run"
            echo ""
            echo "| Recipe | Result |"
            echo "|--------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          for dir in "$BASE"/*/; do
            script="${dir}run.mjs"
            [ -f "$script" ] || continue
            name=$(basename "$dir")
            total=$((total + 1))
            if out=$(node "$script" 2>&1) && printf '%s\n' "$out" | grep -q "RESULT: OK"; then
              echo "| \`$name\` | ✅ pass |" >> "$GITHUB_STEP_SUMMARY"
              echo "PASS  $name"
            else
              echo "| \`$name\` | ❌ fail |" >> "$GITHUB_STEP_SUMMARY"
              echo "FAIL  $name"
              printf '%s\n' "$out"
              fail=$((fail + 1))
            fi
          done

          {
            echo ""
            echo "**$((total - fail)) / $total recipes passed**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$total" -eq 0 ]; then
            echo "::error::no composition recipe scripts found"
            exit 1
          fi
          if [ "$fail" -gt 0 ]; then
            echo "::error::$fail composition recipe(s) failed"
            exit 1
          fi
          echo "All $total composition recipes passed."
