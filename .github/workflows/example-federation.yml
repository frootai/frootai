# [M7.9] Sample workflow: FrootAI Action with MCP Federation
#
# Demonstrates the v6 federation surface by running `evaluate` against
# play 29-mcp-gateway with the Azure MCP area pre-attached.
# This workflow is SECRET-FREE — it uses only public paths and the
# shipped trust manifest (no mcp-trust-file override needed).
#
# Fork-friendly: runs on workflow_dispatch so contributors can trigger
# manually without push/PR permissions on protected branches.

name: Example — Federation Evaluate

on:
  workflow_dispatch:
  push:
    paths:
      - 'solution-plays/29-mcp-gateway/**'
  pull_request:
    paths:
      - 'solution-plays/29-mcp-gateway/**'

permissions:
  contents: read

jobs:
  federation-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run FrootAI evaluate with Azure federation
        id: frootai
        uses: ./
        with:
          command: evaluate
          play: 29-mcp-gateway
          mcp-attach: azure
          mcp-federation: 'on'
          version: '6.0.0-alpha.2'
          threshold: '0.7'
          format: json

      - name: Print federation outputs
        shell: bash
        run: |
          echo "## Federation Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Output | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | \`${{ steps.frootai.outputs.status }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Eval Score | \`${{ steps.frootai.outputs.eval-score }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MCP Attached | \`${{ steps.frootai.outputs.mcp-attached }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MCP Tools Count | \`${{ steps.frootai.outputs.mcp-tools-count }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate on eval score
        shell: bash
        run: |
          if [ "${{ steps.frootai.outputs.status }}" = "fail" ]; then
            echo "::error::Evaluation failed — score below threshold"
            exit 1
          fi
          echo "Evaluation passed with federation attached: ${{ steps.frootai.outputs.mcp-attached }}"
