# [M7.10] Sample workflow: FrootAI Action with Multi-Area MCP Attach
#
# Demonstrates the v6 federation surface by attaching BOTH the Azure
# and Playwright MCP areas, then running a custom evaluate step that
# exercises tools from both areas.
# This workflow is SECRET-FREE — it uses only public paths and the
# shipped trust manifest (no mcp-trust-file override needed).
#
# Fork-friendly: runs on workflow_dispatch so contributors can trigger
# manually without push/PR permissions on protected branches.

name: Example — Multi-MCP Evaluate

on:
  workflow_dispatch:
  push:
    paths:
      - 'solution-plays/23-browser-automation-agent/**'
      - 'solution-plays/29-mcp-gateway/**'
  pull_request:
    paths:
      - 'solution-plays/23-browser-automation-agent/**'
      - 'solution-plays/29-mcp-gateway/**'

permissions:
  contents: read

jobs:
  multi-mcp-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run FrootAI evaluate with Azure + Playwright federation
        id: frootai
        uses: ./
        with:
          command: evaluate
          play: 23-browser-automation-agent
          mcp-attach: azure,playwright
          mcp-federation: 'on'
          version: '6.0.0-alpha.2'
          threshold: '0.7'
          format: json

      - name: Verify both areas attached
        shell: bash
        run: |
          ATTACHED='${{ steps.frootai.outputs.mcp-attached }}'
          echo "Attached areas: $ATTACHED"

          # Verify azure is in the attached array
          if ! echo "$ATTACHED" | jq -e 'index("azure")' > /dev/null 2>&1; then
            echo "::error::Expected 'azure' in mcp-attached output"
            exit 1
          fi

          # Verify playwright is in the attached array
          if ! echo "$ATTACHED" | jq -e 'index("playwright")' > /dev/null 2>&1; then
            echo "::error::Expected 'playwright' in mcp-attached output"
            exit 1
          fi

          echo "Both areas confirmed attached"

      - name: Verify tool count spans both areas
        shell: bash
        run: |
          TOOLS='${{ steps.frootai.outputs.mcp-tools-count }}'
          echo "Total MCP tools registered: $TOOLS"

          # With both areas attached we expect a meaningful tool count
          if [ "$TOOLS" -lt 2 ]; then
            echo "::error::Expected mcp-tools-count >= 2 with two areas attached (got: $TOOLS)"
            exit 1
          fi

          echo "Tool count looks healthy: $TOOLS tools across azure + playwright"

      - name: Print federation summary
        shell: bash
        run: |
          echo "## Multi-MCP Federation Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Output | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | \`${{ steps.frootai.outputs.status }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Eval Score | \`${{ steps.frootai.outputs.eval-score }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MCP Attached | \`${{ steps.frootai.outputs.mcp-attached }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MCP Tools Count | \`${{ steps.frootai.outputs.mcp-tools-count }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate on eval score
        shell: bash
        run: |
          if [ "${{ steps.frootai.outputs.status }}" = "fail" ]; then
            echo "::error::Evaluation failed — score below threshold"
            exit 1
          fi
          echo "Multi-MCP evaluation passed with areas: ${{ steps.frootai.outputs.mcp-attached }}"
