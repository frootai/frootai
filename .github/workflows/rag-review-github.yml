# AI-Powered Code Review Workflow
# Layer 3 — Agentic Workflow. Compiles to GitHub Actions for automated AI code review.

name: AI Code Review
on:
  pull_request:
    branches: [main]
    paths: ['solution-plays/01-enterprise-rag/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate canonical play contract
        run: |
          node scripts/solution-play-manifest-contract.mjs --check
          node --test scripts/test-solution-play-engine-corpus.mjs
      - name: Run deterministic endpoint evaluation
        run: node --test solution-plays/runtime/test/evaluation.test.mjs
      - name: Post review summary
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ FrootAI AI Review passed. Canonical manifest and deterministic endpoint evaluation contracts are valid.'
            })
