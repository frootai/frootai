name: Sync Pricing

# Daily pricing refresh — pulls latest model token prices and opens a PR
# if any price changed ≥ 1%.
# Tracker: P2.1.003 (PRD-004 §5.1 cost estimator)

on:
  schedule:
    # Daily at 06:00 UTC — before the EU workday
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Refresh pricing data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml

      - name: Sync pricing
        run: node scripts/sync-pricing.cjs

      - name: Check for meaningful diff
        id: diff
        run: |
          # Stage the file so git diff works
          git add src/data/pricing.json

          # Check if any price changed by ≥ 1% (skip refreshedAt timestamp changes)
          DIFF=$(git diff --cached --numstat src/data/pricing.json | awk '{print $1+$2}')
          if [ "${DIFF:-0}" -le 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No meaningful pricing changes (only timestamp)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "📊 Pricing data changed — opening PR."
          fi

      - name: Create PR with updated pricing
        if: steps.diff.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(pricing): daily sync — model prices updated'
          title: 'chore(pricing): daily pricing sync'
          body: |
            Automated daily pricing refresh from `pnpm pricing:sync`.

            **Sources:**
            - Azure OpenAI: https://azure.microsoft.com/en-us/pricing/details/cognitive-services/openai-service/
            - OpenAI: https://openai.com/api/pricing/
            - Anthropic: https://docs.anthropic.com/en/docs/about-claude/models

            Please review the diff — any model with ≥ 1% price change is flagged.

            Tracker: P2.1.003
          branch: chore/pricing-sync
          labels: dependencies,pricing
          delete-branch: true
