name: Sync README Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '**/README.md'
      - 'npm-mcp/package.json'
      - 'npm-mcp/index.js'
      - 'scripts/validate-readmes.mjs'
      - 'scripts/test-validate-readmes.mjs'
      - '.github/workflows/sync-readme.yml'
      - 'vscode-extension/package.json'
  push:
    branches: [main]
    paths:
      - '**/README.md'

concurrency:
  group: sync-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-readmes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check README consistency across key files
        run: |
          node --test scripts/test-validate-readmes.mjs
          node scripts/validate-readmes.mjs
      - name: Summary
        if: always()
        run: |
          echo \"## README Sync\" >> $GITHUB_STEP_SUMMARY
          echo \"✅ README consistency validated\" >> $GITHUB_STEP_SUMMARY