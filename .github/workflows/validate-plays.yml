name: Validate Solution Plays

on:
  push:
    paths:
      - 'solution-plays/**'
      - 'scripts/build-solution-play-index.mjs'
      - 'scripts/test-solution-play-index.mjs'
      - 'scripts/solution-play-*.mjs'
      - 'scripts/test-solution-play-*.mjs'
      - 'scripts/validate-flagship-iac.mjs'
      - 'data/certification/**'
      - 'schemas/solution-play-certification-evidence.v1.schema.json'
      - 'orchard/schema/solution-play-index.schema.json'
      - 'orchard/examples/solution-play-index.example.json'
      - 'orchard/registry/solution-play-index.json'
  pull_request:
    paths:
      - 'solution-plays/**'
      - 'scripts/build-solution-play-index.mjs'
      - 'scripts/test-solution-play-index.mjs'
      - 'scripts/solution-play-*.mjs'
      - 'scripts/test-solution-play-*.mjs'
      - 'scripts/validate-flagship-iac.mjs'
      - 'data/certification/**'
      - 'schemas/solution-play-certification-evidence.v1.schema.json'
      - 'orchard/schema/solution-play-index.schema.json'
      - 'orchard/examples/solution-play-index.example.json'
      - 'orchard/registry/solution-play-index.json'
  workflow_dispatch:

jobs:
  canonical-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify canonical 101-play index
        run: |
          npm run check:solution-play-index
          npm run test:solution-play-index

  validate-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate all 101 manifest contracts
        run: |
          node scripts/solution-play-manifest-contract.mjs --check
          node --test scripts/test-solution-play-manifest-contract.mjs
      - name: Initialize all 101 plays through the engine
        run: node --test scripts/test-solution-play-engine-corpus.mjs
      - name: Verify certification, policy, and runtime contracts
        run: |
          node --test scripts/test-solution-play-certification.mjs \
            scripts/test-solution-play-certification-index.mjs \
            scripts/test-solution-play-policy.mjs \
            solution-plays/runtime/test/*.test.mjs
