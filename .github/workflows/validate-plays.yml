name: Validate Solution Plays

on:
  push:
    paths:
      - '.github/workflows/validate-plays.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'solution-plays/**'
      - 'scripts/build-solution-play-index.mjs'
      - 'scripts/test-solution-play-index.mjs'
      - 'scripts/solution-play-*.mjs'
      - 'scripts/test-solution-play-*.mjs'
      - 'scripts/validate-flagship-iac.mjs'
      - 'schemas/solution-play-*.schema.json'
      - 'tests/fixtures/solution-play-delivery-profile/**'
      - 'tests/fixtures/solution-play-telemetry-profile/**'
      - 'tests/fixtures/solution-play-evaluation-profile/**'
      - 'tests/fixtures/solution-play-identity-profile/**'
      - 'tests/fixtures/solution-play-operations-profile/**'
      - 'tests/fixtures/solution-play-certification-harness/**'
      - 'tests/fixtures/solution-play-github-adapter/**'
      - 'data/claude/**'
      - 'data/certification/**'
      - 'orchard/schema/solution-play-index.schema.json'
      - 'orchard/examples/solution-play-index.example.json'
      - 'orchard/registry/solution-play-index.json'
  pull_request:
    paths:
      - '.github/workflows/validate-plays.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'solution-plays/**'
      - 'scripts/build-solution-play-index.mjs'
      - 'scripts/test-solution-play-index.mjs'
      - 'scripts/solution-play-*.mjs'
      - 'scripts/test-solution-play-*.mjs'
      - 'scripts/validate-flagship-iac.mjs'
      - 'schemas/solution-play-*.schema.json'
      - 'tests/fixtures/solution-play-delivery-profile/**'
      - 'tests/fixtures/solution-play-telemetry-profile/**'
      - 'tests/fixtures/solution-play-evaluation-profile/**'
      - 'tests/fixtures/solution-play-identity-profile/**'
      - 'tests/fixtures/solution-play-operations-profile/**'
      - 'tests/fixtures/solution-play-certification-harness/**'
      - 'tests/fixtures/solution-play-github-adapter/**'
      - 'data/claude/**'
      - 'data/certification/**'
      - 'orchard/schema/solution-play-index.schema.json'
      - 'orchard/examples/solution-play-index.example.json'
      - 'orchard/registry/solution-play-index.json'
  workflow_dispatch:

jobs:
  solution-play-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate vNext contracts and reviewed debt
        run: |
          npm run test:solution-play-schemas
          npm run test:solution-play-delivery-profile
          npm run validate:solution-play-delivery-profile
          npm run test:solution-play-telemetry
          npm run validate:solution-play-telemetry
          npm run test:solution-play-evaluation
          npm run validate:solution-play-evaluation
          npm run test:solution-play-identity
          npm run validate:solution-play-identity
          npm run test:solution-play-operations
          npm run validate:solution-play-operations
          npm run contracts:inventory
          npm run quality:solution-plays

  certification-harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify atomic clean-checkout certification
        run: npm run test:solution-play-certification-harness

  github-adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify deterministic GitHub Copilot projection
        run: |
          npm run test:solution-play-github-adapter
          npm run test:solution-play-github-conformance

  claude-foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify self-contained Claude foundation plugin
        run: npm run test:solution-play-claude-foundation

  canonical-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify canonical 101-play index
        run: |
          npm run check:solution-play-index
          npm run test:solution-play-index

  validate-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate all 101 manifest contracts
        run: |
          node scripts/solution-play-manifest-contract.mjs --check
          node --test scripts/test-solution-play-manifest-contract.mjs
      - name: Initialize all 101 plays through the engine
        run: node --test scripts/test-solution-play-engine-corpus.mjs
      - name: Verify certification, policy, and runtime contracts
        run: |
          node --test scripts/test-solution-play-certification.mjs \
            scripts/test-solution-play-certification-index.mjs \
            scripts/test-solution-play-policy.mjs \
            solution-plays/runtime/test/*.test.mjs
