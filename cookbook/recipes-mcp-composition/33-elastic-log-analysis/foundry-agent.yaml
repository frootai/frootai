# [X8.27] Per-recipe Foundry agent template — Elastic Log Analysis (Elastic + Context7 + MS Learn)
#
# Packages this cookbook composition recipe's agent prompt + mcp_scope together
# as a deployable Azure AI Foundry PromptAgent. Deploy per-recipe via the
# Foundry CLI / scripts/foundry/deploy.sh. The recipe's attached MCP areas are
# pre-attached for every session via FROOTAI_PREATTACH.

apiVersion: foundry.azure.com/v1
kind: PromptAgent
metadata:
  name: frootai-recipe-33-elastic-log-analysis
  version: 1.0.0
  labels:
    track: cookbook-composition
    recipe: 33-elastic-log-analysis
    phase: X8

spec:
  model: gpt-4o-mini
  temperature: 0.2
  topP: 0.95

  # The recipe's agent prompt, baked in as the system instructions.
  instructions: |
    Analyze recent Elastic logs, correlate errors with library docs via Context7, and ground fixes in MS Learn guidance.

  # The recipe's mcp_scope — these MCP areas are attached for every session.
  mcp_scope:
    attached: ["elastic", "context7", "ms-learn"]
    router_config:
      detach_on_finish: true

  identity:
    type: SystemAssigned
  azureCredential: DefaultAzureCredential

  env:
    # Pre-attach the recipe's MCP areas (mirrors mcp_scope.attached).
    FROOTAI_PREATTACH:
      description: "Comma-separated MCP areas to pre-attach for this recipe"
      required: false
      default: elastic,context7,ms-learn
    FROOTAI_FEDERATION:
      description: "Federation kill-switch (on|off). Default: on."
      required: false
      default: on

  resources:
    cpu: "1"
    memory: "2Gi"
    timeoutSeconds: 60

  telemetry:
    sessionEvents: true
    appInsights:
      enabled: true
      role: frootai-recipe-33-elastic-log-analysis
