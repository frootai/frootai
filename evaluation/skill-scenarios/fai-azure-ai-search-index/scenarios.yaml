skill: fai-azure-ai-search-index
config:
  language: python
scenarios:
  - name: vector_index_hnsw_managed_identity
    prompt: |
      Create an Azure AI Search index for RAG with a vector field using an HNSW
      profile, authenticated with managed identity (no keys).
    expected_patterns:
      - "DefaultAzureCredential"
      - "VectorSearch"
      - "HnswAlgorithmConfiguration"
      - "create_or_update_index"
    forbidden_patterns:
      - "AzureKeyCredential\\([\"']"   # no hardcoded admin key
      - "admin_key"
    tags: [azure, search, rag]
    mock_response: |
      from azure.identity import DefaultAzureCredential
      from azure.search.documents.indexes import SearchIndexClient
      from azure.search.documents.indexes.models import (
          SearchIndex, SearchField, SearchFieldDataType,
          VectorSearch, HnswAlgorithmConfiguration, VectorSearchProfile,
      )

      client = SearchIndexClient(endpoint=ENDPOINT, credential=DefaultAzureCredential())

      vector_search = VectorSearch(
          algorithms=[HnswAlgorithmConfiguration(name="hnsw-config")],
          profiles=[VectorSearchProfile(name="vec", algorithm_configuration_name="hnsw-config")],
      )
      index = SearchIndex(name="docs", fields=FIELDS, vector_search=vector_search)
      client.create_or_update_index(index)
