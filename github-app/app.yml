# FrootAI GitHub App — Marketplace Configuration
#
# Features:
#   1. Auto-detect .fai-manifest.json in repos
#   2. Run eval on PR (via eval-action)
#   3. Manifest validation check (L0 schema)
#   4. "Open in Studio" link in PR comments
#
# Permissions: minimal scope (contents:read, checks:write, pull_requests:write)
# Pricing: Free for public repos; Pro plan for private repos
#
# Tracker: P3.2.005

app_name: FrootAI
description: "AI agent manifest validation + eval for your repos. Auto-detects .fai-manifest.json, runs eval on PRs, and links to FrootAI Studio."
url: https://frootai.dev
logo: https://frootai.dev/img/frootai-mark.svg

# ── Webhook ──────────────────────────────────────────────────────────────

webhook_url: https://engine.frootai.dev/api/github-app/webhook
webhook_secret: GITHUB_APP_WEBHOOK_SECRET # stored in Key Vault

# ── Permissions ──────────────────────────────────────────────────────────

permissions:
  contents: read          # Read manifest files
  checks: write           # Create check runs for eval results
  pull_requests: write    # Post PR comments with results + Studio links
  metadata: read          # Required by GitHub

# ── Events ───────────────────────────────────────────────────────────────

events:
  - push                  # Detect new/changed manifests
  - pull_request          # Run eval on PR
  - installation          # Track installs

# ── Marketplace Listing ──────────────────────────────────────────────────

marketplace:
  name: FrootAI
  tagline: "AI agent validation + eval for your repos"
  category: Code quality
  pricing:
    - plan: free
      description: "Free for public repos"
      features:
        - Manifest validation (L0 schema check)
        - "Open in Studio" links in PR comments
        - Eval results as check runs (public repos only)
    - plan: pro
      price: 0  # Included with FrootAI Pro subscription
      description: "For private repos — requires FrootAI Pro plan"
      features:
        - Everything in Free
        - Private repo support
        - Custom eval datasets
        - Eval history tracking
