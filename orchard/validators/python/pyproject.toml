[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "frootai-orchard"
version = "0.1.0"
description = "Reference Python validator for FAI Orchard schemas (Accelerator + Manifest). Apache-2.0 — commercial use OK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "FrootAI", email = "support@frootai.dev" }]
keywords = ["frootai", "orchard", "jsonschema", "validator", "accelerator", "azure", "gcp", "aws"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: File Formats :: JSON :: JSON Schema",
]
dependencies = [
    "jsonschema[format]>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://frootai.dev/orchard"
Source = "https://github.com/frootai/frootai/tree/main/orchard/validators/python"
Issues = "https://github.com/frootai/frootai/issues"
Documentation = "https://frootai.dev/docs/orchard"

[tool.hatch.build.targets.wheel]
packages = ["src/frootai_orchard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -q"
