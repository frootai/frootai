name: Copilot Studio Contract Review

on:
  pull_request:
    branches: [main]
    paths: ["solution-plays/08-copilot-studio-bot/**"]

permissions:
  contents: read

jobs:
  contract-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate ownership contract
        run: node --test scripts/test-solution-play-power-platform-ownership.mjs
      - name: Validate offline cases
        working-directory: solution-plays/08-copilot-studio-bot
        run: python evaluation/eval.py --test-set evaluation/test-set.jsonl